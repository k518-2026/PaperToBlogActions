name: Auto Post Research Papers to WordPress

on:
  # Daily scheduled run (10:00 UTC = 19:00 JST / 毎晩19時)
  schedule:
    - cron: '0 10 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Simulate without sending email or updating history)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force run (Ignore posted history and pick newest paper)'
        type: boolean
        required: false
        default: false
      topic:
        description: 'Filter topic (e.g. プログラミング教育 / コンピューテーショナルシンキング / 情報教育)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Paper-to-Blog Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.6-flash' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          WP_POST_STATUS: ${{ vars.WP_POST_STATUS || 'publish' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_TOPIC: ${{ inputs.topic }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ] || [ "$INPUT_DRY_RUN" = "True" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INPUT_FORCE" = "true" ] || [ "$INPUT_FORCE" = "True" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS="$ARGS --topic '$INPUT_TOPIC'"
          fi
          echo "Executing: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Upload Post & Infographic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-post-assets
          path: |
            temp/eyecatch.png
            temp/preview_post.html
            temp/image_generation_debug.txt
          if-no-files-found: ignore

      - name: Display Image Generation Diagnostic Summary
        if: always()
        run: |
          if [ -f temp/image_generation_debug.txt ]; then
            echo "### 🎨 Image Generation Status & Diagnostics" >> $GITHUB_STEP_SUMMARY
            cat temp/image_generation_debug.txt >> $GITHUB_STEP_SUMMARY
          fi


      - name: Commit & Push Updated History
        if: ${{ inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_papers.json data/POSTED_PAPERS.md
          if git diff --staged --quiet; then
            echo "No state updates to commit."
          else
            git commit -m "Update posted papers state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

